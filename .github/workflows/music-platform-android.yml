name: Music Platform Android APK
on:
  push:
    branches: [music-platform-build]
    paths:
      - 'MusicPlatform/**'
      - '.github/workflows/music-platform-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        run: gradle --no-daemon -p MusicPlatform :app:assembleDebug
      - name: Verify APK
        run: test -s MusicPlatform/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MusicPlatform-debug-apk
          path: MusicPlatform/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
