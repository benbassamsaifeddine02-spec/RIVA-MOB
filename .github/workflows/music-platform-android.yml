name: Music Platform Android APK
on:
  push:
    branches: [music-platform-build]
    paths:
      - 'MusicPlatform/**'
      - '.github/workflows/music-platform-android.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        run: gradle --no-daemon -p MusicPlatform :app:assembleDebug
      - name: Verify APK
        run: |
          test -s MusicPlatform/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging MusicPlatform/app/build/outputs/apk/debug/app-debug.apk | head -n 1
      - uses: actions/upload-artifact@v4
        with:
          name: MusicPlatform-debug-apk
          path: MusicPlatform/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
